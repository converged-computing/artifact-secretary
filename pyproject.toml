[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "artifact-secretary"
version = "0.0.0"
description = "Agentic discovery of compiled HPC applications: characterize an artifact's arch, linkage, capability, and provenance so a scheduler knows where it can run."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Base install = the SDK-free core (inspection library + framework + CLI shell).
# It does NOT pull a model backend; pick one of the extras below to actually run
# the agent. `import secretary` and the deterministic inspection work with just
# these.
dependencies = [
    "pyelftools>=0.30",   # ELF linkage reading (pure-Python, also bind-mounted into containers)
    "anyio>=4",           # the CLI drives the async task flow via anyio.run
]

[project.optional-dependencies]
# One extra per model backend. `make_runner` imports only the chosen backend and
# fails fast with the matching install hint, so you install just what you use.
claude = ["claude-agent-sdk>=0.2"]                 # --backend claude (default, tested path)
gemini = ["google-adk>=1.0"]                       # --backend gemini
aws    = ["strands-agents>=0.1", "boto3>=1.34"]    # --backend aws (Bedrock)

# Convenience: everything at once.
all = ["claude-agent-sdk>=0.2", "google-adk>=1.0", "strands-agents>=0.1", "boto3>=1.34"]

# Test/dev tooling (the test suite itself is stdlib + the base deps).
dev = ["pytest>=8"]

[project.scripts]
artifact-secretary = "secretary.cli.main:main"

[tool.setuptools.packages.find]
include = ["secretary*"]
