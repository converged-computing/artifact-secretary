[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "artifact-secretary"
version = "0.0.1"
description = "Agentic discovery of compiled HPC applications: characterize an artifact's arch, linkage, capability, and provenance so a scheduler knows where it can run."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyelftools>=0.30",   # ELF linkage reading (pure-Python, also copied into containers)
    "anyio>=4",           # the CLI drives the async task flow via anyio.run
    "behalf>=0.1",        # the scoped-agent framework (Task/ToolSpec/runner backends)
]

[project.optional-dependencies]
# backend SDKs come from behalf's extras, so a backend choice pulls the right one
claude = ["behalf[claude]>=0.1"]   # --backend claude (default)
gemini = ["behalf[gemini]>=0.1"]   # --backend gemini
aws    = ["behalf[aws]>=0.1"]      # --backend aws (Bedrock)
all    = ["behalf[all]>=0.1"]
dev = ["pytest>=8"]

[project.scripts]
artifact-secretary = "secretary.cli.main:main"

[tool.setuptools.packages.find]
include = ["secretary*"]
